name: Check Coupang return-market stock

on:
  workflow_dispatch:
    inputs:
      group:
        description: "Product group to scan"
        required: true
        type: choice
        default: "iphone"
        options:
          - iphone
          - macbook
          - ipad
          - other
          - all
      limit:
        description: "0 = all targets in the selected group; otherwise scan the first N"
        required: true
        default: "0"
      concurrency:
        description: "Browser workers (1-8)"
        required: true
        default: "4"
      delay_ms:
        description: "Minimum delay per worker in milliseconds (>=250)"
        required: true
        default: "1000"

permissions:
  contents: read

jobs:
  scan:
    # Coupang returns HTTP 403 from GitHub-hosted datacenter IPs.
    # This job intentionally runs only on the repository's Windows x64 self-hosted runner.
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 360
    env:
      SCAN_GROUP: ${{ inputs.group }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        shell: pwsh
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        shell: pwsh
        run: npx playwright install chromium

      - name: Validate inputs and scan
        shell: pwsh
        env:
          INPUT_LIMIT: ${{ inputs.limit }}
          INPUT_CONCURRENCY: ${{ inputs.concurrency }}
          INPUT_DELAY_MS: ${{ inputs.delay_ms }}
        run: |
          foreach ($value in @($env:INPUT_LIMIT, $env:INPUT_CONCURRENCY, $env:INPUT_DELAY_MS)) {
            if ($value -notmatch '^\d+$') {
              throw 'Inputs must be non-negative integers.'
            }
          }

          $limit = [int]$env:INPUT_LIMIT
          $workers = [int]$env:INPUT_CONCURRENCY
          $delayMs = [int]$env:INPUT_DELAY_MS
          $validGroups = @('all', 'macbook', 'ipad', 'iphone', 'other')

          if ($workers -lt 1 -or $workers -gt 8) {
            throw 'concurrency must be between 1 and 8.'
          }
          if ($delayMs -lt 250) {
            throw 'delay_ms must be at least 250.'
          }
          if ($env:SCAN_GROUP -notin $validGroups) {
            throw "Invalid group: $env:SCAN_GROUP"
          }

          $scanArgs = @(
            '--all',
            '--group', $env:SCAN_GROUP,
            '--concurrency', $workers,
            '--delay-ms', $delayMs,
            '--output', 'stock-latest.json'
          )
          if ($limit -gt 0) {
            $scanArgs += @('--limit', $limit)
          }

          npm run stock:check -- @scanArgs
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Upload scan result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coupang-stock-${{ env.SCAN_GROUP }}-latest
          path: stock-latest.json
          if-no-files-found: warn
          retention-days: 14
